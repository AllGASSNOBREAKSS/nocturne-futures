name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c requirements/frozen-shadow.constraints.txt -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Audit smoke test
        run: python -m nocturne audit

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: ts
        run: npm ci
      - name: Typecheck
        working-directory: ts
        run: npm run typecheck

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pybind11 cmake ninja pytest
      - name: Configure
        run: cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR=$(python -m pybind11 --cmakedir)
      - name: Build
        run: cmake --build native/build
      - name: Parity test
        run: PYTHONPATH=native/build python -m pytest tests/test_native_parity.py -q

  windows-shadow:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c requirements/frozen-shadow.constraints.txt -e ".[dev]"
      - name: Windows storage, recovery and research contracts
        run: python -m pytest tests/test_shadow_operations.py tests/test_shadow_service.py tests/test_contract_targets.py tests/test_macro_proximity.py tests/test_shadow_alerts.py tests/test_market_snapshots.py tests/test_outcome_audit.py tests/test_contract_replay.py tests/test_target_survival.py tests/test_shadow_task_runner.py tests/test_research_orchestrator.py tests/test_daily_experiment.py tests/test_databento_access.py tests/test_futures_pilot.py tests/test_phase3o_recovery.py tests/test_recovery_snapshot.py tests/test_headless_launcher.py tests/test_environment_integrity.py tests/test_api_security.py tests/test_encrypted_backup.py tests/test_tls_deployment.py
      - name: Quarantine isolation and independent issuance contracts
        run: python -m pytest tests/test_phase3t_integrity.py -q
      - name: Scheduled task definition dry run (no registration)
        shell: powershell
        run: ./scripts/install_shadow_task.ps1 -WhatIf
      - name: Research task definition dry run (no registration)
        shell: powershell
        run: ./scripts/install_research_task.ps1 -WhatIf
      - name: Unattended task definition dry run (no credentials or registration)
        shell: powershell
        run: ./scripts/install_shadow_task.ps1 -LogonMode Password -WakeToRun -TaskName Nocturne-Unattended-DryRun -WhatIf
      - name: Unattended research definition dry run (no credentials or registration)
        shell: powershell
        run: ./scripts/install_research_task.ps1 -LogonMode Password -WakeToRun -TaskName Nocturne-Research-Unattended-DryRun -WhatIf

  windows-locked-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Download only reviewed wheel bytes
        shell: powershell
        run: |
          python -m pip download --only-binary=:all: --no-deps --require-hashes --dest "$env:RUNNER_TEMP/locked-wheels" -r requirements/windows-py314-security.hashes.txt
      - name: Offline bootstrap and installed-record/inference verification
        shell: powershell
        run: ./scripts/bootstrap_locked_environment.ps1 -Python (Get-Command python).Source -Environment "$env:RUNNER_TEMP/locked-nocturne" -Wheelhouse "$env:RUNNER_TEMP/locked-wheels" -Profile security
      - name: Frozen inference and corruption rejection contracts
        shell: powershell
        run: '& "$env:RUNNER_TEMP/locked-nocturne/Scripts/python.exe" -m pytest tests/test_environment_integrity.py tests/test_api_security.py tests/test_encrypted_backup.py tests/test_tls_deployment.py -q'
