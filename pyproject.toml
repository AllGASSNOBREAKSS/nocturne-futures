[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-futures"
version = "0.1.0"
description = "An overnight futures outlook engine for ES, NQ, GC and SI that publishes dated calls and grades itself."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AllGASSNOBREAKSS" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "requests>=2.31",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jsonschema>=4.22",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
research = ["lightgbm>=4.6,<5"]

[project.scripts]
nocturne = "nocturne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
