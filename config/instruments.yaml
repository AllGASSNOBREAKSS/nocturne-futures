# Instrument registry. `tick` and `multiplier` are the CME/COMEX contract specs
# used to translate point moves into dollars per contract.
instruments:
  - code: ES
    symbol: "ES=F"
    name: "E-mini S&P 500"
    contract: "Dec 2026"
    exchange: "CME"
    tick: 0.25
    multiplier: 50
    cash_proxy: "^GSPC"
    session_close_et: "16:00"
